name: Raco CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: raco-ci-${{ github.ref }}
  cancel-in-progress: true
env:
  NX_DAEMON: 'false'
  NX_ISOLATE_PLUGINS: 'false'
  NX_NO_CLOUD: 'true'
  ENABLED_PLUGINS: operation,frontline
  NODE_OPTIONS: --max-old-space-size=6144
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      saas-mongo:
        image: mongo:7
        ports: ['27018:27017']
      saas-redis:
        image: redis:7-alpine
        ports: ['16389:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate delivery configuration
        run: node scripts/ci/check-delivery.cjs
      - name: Validate automation templates
        run: node scripts/raco-automation-templates.cjs --check
      - name: Shared backend and frontend regression suites
        run: |
          pnpm nx test erxes-api-shared --runInBand
          pnpm nx test core-ui --runInBand
      - name: Router and AI failover regression tests
        run: pnpm exec tsx --test backend/gateway/src/apollo-router/__tests__/windows-router.spec.ts backend/services/automations/src/ai/bridge/__tests__/racoFallback.spec.ts
      - name: Record existing project lint debt
        continue-on-error: true
        run: pnpm nx run-many -t lint -p core-ui core-api gateway operation_api automations-service --parallel=1
      - name: Build backend services
        run: pnpm nx run-many -t build -p core-api gateway operation_api frontline_api sales_api automations-service --parallel=1
      - name: SaaS trial and provisioning regression tests
        run: |
          pnpm exec jest --config backend/erxes-api-shared/jest.config.ts --runInBand --testMatch='**/raco-access.spec.ts'
          pnpm exec jest --config backend/core-api/src/modules/raco-saas/jest.config.cjs --runInBand
          RACO_SAAS_TEST_MONGO_URL='mongodb://127.0.0.1:27018/test?directConnection=true' RACO_SAAS_TEST_REDIS_PORT=16389 node scripts/raco-saas-smoke.cjs
      - name: Build operation UI
        run: pnpm nx build operation_ui
      - name: Build frontline UI
        run: pnpm nx build frontline_ui
      - name: Build sales UI
        run: pnpm nx build sales_ui
      - name: Package corresponding source and build branded UI
        run: |
          pnpm source:raco
          pnpm nx build core-ui
          # Generated archives are gitignored and are not part of Nx's cache key.
          # Always overlay this commit's archive after restoring/building the UI.
          cp frontend/core-ui/src/assets/raco-source.tar.gz dist/frontend/core-ui/assets/raco-source.tar.gz
          test -s dist/frontend/core-ui/assets/raco-source.tar.gz
          cmp frontend/core-ui/src/assets/raco-source.tar.gz dist/frontend/core-ui/assets/raco-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: raco-build-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            backend/core-api/dist/
            backend/gateway/dist/
            backend/plugins/operation_api/dist/
            backend/plugins/frontline_api/dist/
            backend/plugins/sales_api/dist/
            backend/services/automations/dist/
            backend/erxes-api-shared/dist/
            backend/erxes-api-shared/utils/
            backend/erxes-api-shared/core-types/
            backend/erxes-api-shared/core-modules/
            dist/frontend/core-ui/
            dist/frontend/plugins/operation_ui/
            dist/frontend/plugins/frontline_ui/
            dist/frontend/plugins/sales_ui/
      - name: Validation scope
        if: always()
        run: |
          echo 'Tests, application builds, and container smoke checks are release gates. Existing repository-wide lint/shared-UI declaration diagnostics are recorded separately; they are not a clean lint/type certification.' >> "$GITHUB_STEP_SUMMARY"
  images:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: raco-build-${{ github.sha }}
      - uses: docker/setup-buildx-action@v3
      - name: Build local backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/raco/Dockerfile.backend
          load: true
          tags: raco-backend:${{ github.sha }}
          build-args: SOURCE_REPOSITORY=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=raco-backend
          cache-to: type=gha,scope=raco-backend,mode=max
      - name: Build local web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/raco/Dockerfile.web
          load: true
          tags: raco-web:${{ github.sha }}
          build-args: SOURCE_REPOSITORY=https://github.com/${{ github.repository }}
      - name: Smoke test the production containers
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: bash scripts/ci/smoke-containers.sh
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified commit-tagged images
        if: github.event_name != 'pull_request'
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          namespace="ghcr.io/${REPOSITORY,,}"
          for component in backend web; do
            docker tag "raco-$component:$COMMIT" "$namespace-$component:$COMMIT"
            docker push "$namespace-$component:$COMMIT"
          done
          echo "Published backend and web images for commit $COMMIT" >> "$GITHUB_STEP_SUMMARY"
