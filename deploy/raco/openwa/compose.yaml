name: raco-openwa

services:
  openwa:
    image: rmyndharis/openwa:0.25.0
    container_name: raco-openwa
    restart: unless-stopped
    init: true
    stop_grace_period: 75s
    ports:
      - '127.0.0.1:2785:2785'
    environment:
      NODE_ENV: production
      BASE_URL: https://wa.racoai.io
      DASHBOARD_URL: https://wa.racoai.io
      AUTO_START_SESSIONS: 'true'
      NODE_ID: raco-openwa
    volumes:
      - ./data:/app/data
    networks:
      - erxes
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:2785/api/health/ready']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  erxes:
    external: true
    name: erxes_default
