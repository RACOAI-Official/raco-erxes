map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 8080;
    server_name xos.racoai.io *.xos.racoai.io;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;
    location = /healthz { access_log off; return 200 'ok'; }
    location /gateway/ {
        proxy_pass http://gateway:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Discard client-supplied routing headers; tenant identity comes from Host.
        proxy_set_header hostname $host;
        proxy_set_header nginx-hostname $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
    location /plugins/ { try_files $uri =404; add_header Cache-Control 'no-cache'; add_header Access-Control-Allow-Origin '*'; }
    location /assets/ { try_files $uri =404; }
    location = /js/env.js { add_header Cache-Control 'no-store'; }
    location / { try_files $uri $uri/ /index.html; }
}
